<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <thead>
            <tr>
              <th>Speaker</th>
              <th>Title</th>
              <th>Location</th>
              <th>Year</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Rob Garret</td>
              <td>He will make more of you</td>
              <td>BYU-I</td>
              <td>2026</td>
            </tr>
            <tr>
              <td>Elder James O. Fantone</td>
              <td>The Battle is the Lord's</td>
              <td>BYU-I</td>
              <td>2026</td>
            </tr>
            <tr>
              <td>President Alvin F. Meredith III</td>
              <td>The Mission of BYU Idaho</td>
              <td>BYU-I</td>
              <td>2026</td>
            </tr>
          </tbody>
        </table>

        <h2>Add a Devotional</h2>

        <form>
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" name="speaker">

          <label for="title">Title:</label>
          <input type="text" id="title" name="title">

          <label for="location">Location:</label>
          <input type="text" id="location" name="location">

          <label for="year">Year:</label>
          <input type="number" id="year" name="year">

          <button type="button">Add Devotional</button>
        </form>

      </div>
    </main>
  </div>
</body>
</html>
