
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: rgb(120, 96, 64);
            font-family: "Times New Roman", serif;
        }

        #formContainer {
            width: 420px;
            margin: 17px auto;
            background: white;
            border: 10px solid #092c83;
            border-radius: 32px;
            overflow: hidden;
        }

        .hero {
            height: 170px;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center;
            position: relative;
            display: grid;
            place-items: center;
        }

        .hero h1 {
            color: white;
            text-align: center;
            font-size: 32px;
            line-height: 1.1;
            text-shadow: 2px 2px 2px black;
            margin: 0;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 14px;
            cursor: pointer;
        }

        h3 {
            text-align: center;
            font-size: 18px;
            margin: 20px 0;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 170px;
            align-items: center;
            column-gap: 15px;
            row-gap: 20px;
            padding: 0 20px 20px;
        }

        #myForm > input {
            width: 100%;
            height: 22px;
        }

        .gender-options {
            white-space: nowrap;
        }

        .gender-options input {
            margin: 0;
        }

        .full-row {
            grid-column: 1 / 3;
            text-align: center;
        }

        .full-row label {
            white-space: nowrap;
        }

        .submit-row {
            margin-top: 0;
        }

        .scriptures {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: white;
        }

        .scriptures img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }

        #output {
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="formContainer">

        <div class="hero">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed<br>Scripture a Day</h1>
        </div>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">

            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div class="gender-options">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section class="full-row">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="full-row">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="full-row submit-row">
                <button type="submit">Submit</button>
            </section>

        </form>

        <div class="scriptures">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>

    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: [hidden]`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
        });
    </script>

</body>
</html>
