
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlight</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background-color: #e9edef;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        .spotlight {
            width: 100%;
            max-width: 700px;
            min-height: 540px;
            box-sizing: border-box;
            padding: 10px 25px 25px;
            border: 7px solid black;
            border-radius: 34px;
            background-image: url("images/christus.webp");
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
        }

        h1 {
            margin: 0 0 5px;
            font-size: 29px;
            font-weight: normal;
        }

        h2 {
            margin: 8px 0;
            font-size: 21px;
            font-weight: normal;
        }

        .apostle-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin: 8px auto;
        }

        .apostle {
            width: 78px;
            height: 78px;
            border: 6px solid white;
            border-radius: 50%;
            object-fit: cover;
            background-color: #243440;
            transition: border-color 0.2s ease,
                        transform 0.2s ease;
        }

        .presidency .apostle {
            width: 92px;
            height: 92px;
        }

        /* Required mouse-over effect */
        .apostle:hover {
            border-color: #f5d547;
            transform: scale(1.08);
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .spotlight {
                min-height: auto;
                padding: 12px 8px 20px;
                border-radius: 25px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 17px;
            }

            .apostle-row {
                gap: 7px;
            }

            .apostle {
                width: 55px;
                height: 55px;
                border-width: 4px;
            }

            .presidency .apostle {
                width: 65px;
                height: 65px;
            }
        }
    </style>
</head>

<body>
    <main class="spotlight">

        <h1>First Presidency</h1>

        <div class="apostle-row presidency">
            <img class="apostle" src="images/oaks.webp" alt="Dallin H. Oaks" title="Dallin H. Oaks">
            <img class="apostle" src="images/eyring.webp" alt="Henry B. Eyring" title="Henry B. Eyring"> 
            <img class="apostle" src="images/uchtdorf.webp" alt="Dieter F. Uchtdorf" title="Dieter F. Uchtdorf">
        </div>

        <h2>Quorum of the Twelve Apostles</h2>

        <div class="apostle-row">
            <img class="apostle" src="images/bednar.webp" alt="David A. Bednar" title="David A. Bednar">
            <img class="apostle" src="images/cook.webp" alt="Quentin L. Cook" title="Quentin L. Cook">
            <img class="apostle" src="images/christofferson.webp" alt="D. Todd Christofferson" title="D. Todd Christofferson">
            <img class="apostle" src="images/anderson.webp" alt="Neil L. Andersen" title="Neil L. Anderson">
        </div>

        <div class="apostle-row">
            <img class="apostle" src="images/rasband.webp" alt="Ronald A. Rasband" title="Ronald A. Rasband">
            <img class="apostle" src="images/stevenson.webp" alt="Gary E. Stevenson" title="Gary E. Stevenson">
            <img class="apostle" src="images/renlund.webp" alt="Dale G. Renlund" title="Dale G Renlund">
            <img class="apostle" src="images/gong.webp" alt="Gerrit W. Gong" title="Gerrit W. Gong">
        </div>

        <div class="apostle-row">
            <img class="apostle" src="images/soares.webp" alt="Ulisses Soares" title="Ulisses Soares">
            <img class="apostle" src="images/kearon.webp" alt="Patrick Kearon" title="Patrick Kearon">
            <img class="apostle" src="images/gilbert.webp" alt="Clark G. Gilbert" title="Clark G. Gilbert">
            <img class="apostle" src="images/causse.webp" alt="Gérald Caussé" title="Gerald Causse">
        </div>

    </main>
</body>
</html>
